name: Checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Recognition audio-clock regressions
        run: |
          python3 -m pip install numpy==2.4.3
          python3 tests/test_curiosity_context.py
          python3 tests/test_person_recall.py
          python3 tests/test_recognition_context.py
          python3 tests/test_speaker_intervals.py
      - name: Check neural service and model setup syntax
        run: python3 -m py_compile musetalk-service/neural_api.py scripts/setup-neural-models.py
      - run: npm audit --audit-level=high
  documentation:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: docs/Gemfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec bash docs/generate-docs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nodie-technical-solution
          path: docs/TECHNICAL_SOLUTION_DOCUMENT.pdf
