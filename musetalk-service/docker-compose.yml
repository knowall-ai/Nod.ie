services:
  musetalk:
    build: 
      context: .
      dockerfile: Dockerfile
      no_cache: true
    container_name: musetalk
    image: musetalk:latest
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models
      - FACE_SIZE=256
      - LOG_LEVEL=INFO
      - CUDA_VISIBLE_DEVICES=0
      - AVATAR_VIDEO_PATH=/app/avatars/nodie-video-03.mp4
    volumes:
      - ../musetalk-repo/models:/app/models
      - ../assets/avatars:/app/avatars
    restart: unless-stopped
    networks:
      - ai-stack
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ai-stack:
    external: true