<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nod.ie Web Test</title>
    <link rel="stylesheet" href="../renderer.css">
    <style>
        .connected { color: #4caf50; }
        .disconnected { color: #f44336; }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="waveform"></canvas>
        <div id="circle" class="listening">
            <div id="avatar-container">
                <canvas id="avatar-canvas" width="250" height="250" style="border-radius: 50%;"></canvas>
                <video id="avatar-video" muted playsinline style="display: none;">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div id="status-text" class="loading-text" style="display: none;"></div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    <div id="debug-info">
        <div>Status: <span id="status">Initializing...</span></div>
        <div>Unmute WS: <span id="unmute-ws-status">Disconnected</span></div>
        <div>MuseTalk WS: <span id="musetalk-ws-status">Disconnected</span></div>
        <div>Avatar: <span id="avatar-status">Not loaded</span></div>
        <div>Console: <span id="console-errors">0 errors</span></div>
    </div>

    <script src="../env-config.js"></script>
    <script src="../lib/config-schema.js"></script>
    <script src="../config-web.js"></script>
    <script src="../browser-bridge.js"></script>
    <script src="../node_modules/opus-recorder/dist/recorder.min.js"></script>
    <script src="../modules/audio-capture-web.js"></script>
    <script src="../modules/audio-playback-web.js"></script>
    <script src="../modules/musetalk-websocket-client.js"></script>
    <script src="../modules/avatar-manager.js"></script>
    <script src="../modules/websocket-handler.js"></script>
    <script src="../modules/local-voice-session.js"></script>
    <script src="../modules/desktop-drag.js"></script>
    <script src="../renderer.js"></script>
</body>
</html>
