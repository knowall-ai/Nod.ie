# Optional daily journal bridge. Create the owner-only directory before deploying.
services:
  unmute-backend:
    environment:
      NODIE_TIMEZONE: ${NODIE_TIMEZONE:-Europe/London}
    volumes:
      - type: bind
        source: ${NODIE_EVENTS_DIR:?Create and set the local events directory first}
        target: /app/nodie-events
        read_only: true
        bind:
          create_host_path: false
